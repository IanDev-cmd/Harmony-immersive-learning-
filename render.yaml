# Immersive Learning — one service from https://github.com/IanDev-cmd/Harmony-immersive-learning-
# Live: https://harmony-immersive-learning.onrender.com
# Starter so search, uploads, and the voice command queue do not sleep.

services:
  - type: web
    name: harmony-immersive-learning
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      - key: CHROMA_DIR
        value: /app/chroma_db
      - key: SITE_DIR
        value: /site
      - key: PUBLIC_APP_URL
        value: https://harmony-immersive-learning.onrender.com
      - key: GITHUB_REPO_URL
        value: https://github.com/IanDev-cmd/Harmony-immersive-learning-
      - key: XAI_MODEL
        value: grok-3
      - key: GOOGLE_CHAT_MODEL
        value: gemini-2.5-flash-lite
      - key: GOOGLE_EMBED_MODEL
        value: models/gemini-embedding-001
      - key: GOOGLE_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: AGENT_WEBHOOK_SECRET
        sync: false
